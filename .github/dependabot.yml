version: 2
updates:
  # Runtime requirement: a "fix" commit releases the new manifest pin
  - package-ecosystem: uv
    directory: /
    # Only uv.lock: the lower bounds of pyproject.toml are the oldest supported versions
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      # The manifest requirement is a minimum version: a lock update changes nothing
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      dev-tools:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
